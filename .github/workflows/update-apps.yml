name: Update App Store data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://nandinipatel-apps.ronikhirpara18.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Fetch apps and global ratings
        env:
          OUTPUT: ${{ runner.temp }}/apps.json
          PREVIOUS_URL: ${{ env.WORKER_URL }}/apps.json
        run: python3 .github/scripts/fetch_apps.py

      - name: Publish to Cloudflare Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          file="${{ runner.temp }}/apps.json"
          if [ ! -f "$file" ]; then
            echo "No changes to publish"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$WORKER_URL/ingest" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "@$file"
